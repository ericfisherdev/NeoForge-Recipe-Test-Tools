pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'recipe_test'

// Reference extensions that consume the harness as an external consumer would. The harness
// module never depends on these — see each subproject's build.gradle for the one-way
// `:` → `examples:*` dependency direction. They live here so `./gradlew check` exercises
// them alongside the harness, and so review can spot accidental harness → examples coupling.
include ':examples:mekanism-gas-stub'

name: Release publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.0). Required when triggered manually.'
        required: true
        type: string

# Single in-flight publish per tag. Don't cancel a running publish if a second tag
# arrives — wait for the first to finish so we don't leave half-uploaded artifacts.
concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write    # needed to create the GitHub Release
  packages: write    # needed to publish to GitHub Packages

jobs:
  publish:
    name: Publish artifact + draft release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Resolve version + prerelease flag from tag
        id: version
        run: |
          REF="${{ inputs.tag || github.ref_name }}"
          # Defensive: when triggered via workflow_dispatch a careless user could paste the
          # full ref (e.g. "refs/tags/v1.0.0") instead of just the tag name. github.ref_name
          # is already short on tag push, so this is a no-op there.
          REF="${REF#refs/tags/}"
          # Fast-fail on a malformed tag rather than silently publishing an artifact at a
          # garbage version. The on.push.tags filter ('v*') only enforces a leading "v";
          # this regex enforces SemVer 2.0.0 shape — vMAJOR.MINOR.PATCH with an optional
          # hyphen-prefixed pre-release identifier (dot-separated alphanumerics).
          # Hyphen-only is intentional: the prerelease detection further down only inspects
          # for "-", so allowing dot-suffixed shapes like "v1.2.3.rc1" would silently publish
          # a malformed tag as prerelease=false.
          if [[ ! "${REF}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Invalid tag '${REF}'. Expected semver-shape: v1.2.3 or v1.2.3-rc.1 (workflow_dispatch input or tag push)."
            exit 1
          fi
          # Strip leading "v" if present (v1.0.0 → 1.0.0).
          VERSION="${REF#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${REF}"          >> "$GITHUB_OUTPUT"
          # Mark anything with a hyphenated suffix (-rc.1, -beta.2, -alpha.3, -snapshot)
          # as a prerelease so consumers don't get it via "latest".
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved version: ${VERSION} (prerelease=$([[ "${VERSION}" == *-* ]] && echo true || echo false))"

      - name: Build
        run: ./gradlew clean build check -Pmod_version=${{ steps.version.outputs.version }} --no-daemon --stacktrace

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew publishMavenJavaPublicationToGitHubPackagesRepository \
            -Pmod_version=${{ steps.version.outputs.version }} \
            -PgithubPackagesUrl='https://maven.pkg.github.com/${{ github.repository }}' \
            --no-daemon --stacktrace

      - name: Create GitHub draft release with jars attached
        # Pinned to a specific release rather than the floating @v2 tag. The action runs in a
        # context with contents:write + packages:write, so a tag-rewrite supply-chain attack
        # (see tj-actions/changed-files in 2025) on the v2 tag would be high-blast-radius.
        # Pinning to v2.6.2 — the latest Node 20-compatible v2.x release — locks the code that
        # runs here while still letting Dependabot surface bumps within the v2.x line.
        uses: softprops/action-gh-release@v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name:     ${{ steps.version.outputs.tag }}
          draft:      true
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/libs/recipe_test-${{ steps.version.outputs.version }}.jar
            build/libs/recipe_test-${{ steps.version.outputs.version }}-sources.jar
            build/libs/recipe_test-${{ steps.version.outputs.version }}-javadoc.jar

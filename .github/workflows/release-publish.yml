name: Release publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.0). Required when triggered manually.'
        required: true
        type: string

# Single in-flight publish per tag. Don't cancel a running publish if a second tag
# arrives — wait for the first to finish so we don't leave half-uploaded artifacts.
concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve version from tag
        id: version
        run: |
          REF="${{ inputs.tag || github.ref_name }}"
          # Strip leading "v" if present (v1.0.0 → 1.0.0).
          VERSION="${REF#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Build
        run: ./gradlew clean build check -Pmod_version=${{ steps.version.outputs.version }} --no-daemon --stacktrace

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew publishMavenJavaPublicationToGitHubPackagesRepository \
            -Pmod_version=${{ steps.version.outputs.version }} \
            -PgithubPackagesUrl='https://maven.pkg.github.com/${{ github.repository }}' \
            --no-daemon --stacktrace

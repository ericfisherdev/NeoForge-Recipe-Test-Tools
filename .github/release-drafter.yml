name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: 'Features'
    labels:
      - 'feat'
      - 'feature'
  - title: 'Fixes'
    labels:
      - 'fix'
      - 'bug'
  - title: 'Build / CI'
    labels:
      - 'ci'
      - 'build'
  - title: 'Documentation'
    labels:
      - 'docs'
  - title: 'Dependencies'
    labels:
      - 'dependencies'
  - title: 'Tests'
    labels:
      - 'tests'
      - 'test'
  - title: 'Refactors'
    labels:
      - 'refactor'
      - 'chore'

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - 'breaking'
      - 'major'
  minor:
    labels:
      - 'feat'
      - 'feature'
      - 'minor'
  patch:
    labels:
      - 'fix'
      - 'bug'
      - 'docs'
      - 'ci'
      - 'build'
      - 'chore'
      - 'dependencies'
      - 'refactor'
      - 'tests'
      - 'test'
      - 'patch'
  default: patch

template: |
  ## What's changed

  $CHANGES

  **Full changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

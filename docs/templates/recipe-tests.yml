# Sample GitHub Actions workflow for consumer mods using the recipe_test kit.
# Drop this file in your consumer mod's `.github/workflows/recipe-tests.yml`.
#
# What it does:
#   - Boots a NeoForge dedicated GameTest server with `runGameTestServer`.
#   - Discovers every spec at `data/<modid>/recipe_test/machines/*.json` and emits
#     one dynamic GameTest per matching recipe.
#   - Uploads `build/gametest/results/recipe-test.xml` as a JUnit-format report.
#   - Posts a job summary using `dorny/test-reporter` so failed recipes are visible
#     directly on the PR check page.
#
# Tunables (env vars):
#   RECIPE_TEST_FILTER     Regex applied to test names at registration. Useful for
#                          incremental runs: `recipe_test\.forestry\.carpenter\..*`
#                          only registers carpenter tests.
#   RECIPE_TEST_SOFT_FAIL  When `true`, non-PASS results log a warning instead of
#                          failing the GameTest. For triage runs where you want to
#                          see every failure, not just the first.
#
# Memory: NeoForge dev runs are memory-hungry. The forked Minecraft server is a separate
# JVM from Gradle itself, so `GRADLE_OPTS` does NOT control its heap. Configure the game
# server's heap via `jvmArguments` on the `gameTestServer` run in your `build.gradle`:
#
#     runs {
#         gameTestServer {
#             jvmArguments '-Xmx4G'    // bump to '-Xmx8G' for large machine specs
#         }
#     }

name: Recipe Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: recipe-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  recipe-tests:
    name: Recipe Tests (NeoForge ${{ matrix.neoforge }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21']
        neoforge: ['21.1.213']
    env:
      # Gradle's own JVM only — the game server JVM is forked and configured via
      # `jvmArguments` in build.gradle (see comment at top of this file).
      GRADLE_OPTS: -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Opt into the MIT-licensed cache provider. The default Enhanced Caching
          # in v6 is distributed under Gradle's Terms of Use; `basic` is fully
          # @actions/cache. Drop this `with:` block if your repo prefers Enhanced
          # Caching (free for public repos, in Free Preview for private repos as
          # of 2026-03).
          cache-provider: basic

      - name: Run dynamic recipe tests
        run: ./gradlew runGameTestServer --no-daemon --stacktrace
        # Uncomment to scope CI runs to a subset of tests.
        # env:
        #   RECIPE_TEST_FILTER: 'recipe_test\.<your_modid>\.'

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recipe-test-results-jdk${{ matrix.java }}
          path: build/gametest/results/recipe-test.xml
          if-no-files-found: error

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Recipe Tests (JDK ${{ matrix.java }})
          path: build/gametest/results/recipe-test.xml
          reporter: java-junit
          fail-on-error: true

// Reference extension subproject — demonstrates the harness's L2 SPI from the position of an
// external consumer. The harness's root module never depends on this subproject; see
// settings.gradle for the one-way include direction.
//
// Why NeoGradle is applied here: extension code references vanilla MC types (Recipe,
// RecipeHolder, BlockEntity, ResourceLocation) that NeoGradle's userdev plugin remaps from
// the obfuscated runtime jar. A subproject that depended on the root project alone wouldn't
// see those mapped class files; applying userdev here gives the example its own independent
// MC classpath, mirroring how a real consumer mod would be set up.
//
// What this PR ships: compile-only example + unit tests. A follow-up PR adds a runs.gameTestServer
// configuration that loads both the harness mod and this stub mod together for full live
// integration.

plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.0.170'
}

version = '1.0.0'
group = 'dev.recipetest.examples'
base.archivesName = 'mekanism-gas-stub'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Depend on the harness via project dependency. This is the architecturally significant
    // line: the example reaches INTO the harness for its public API; the harness never
    // reaches the other way around. settings.gradle's include directive plus this single
    // line is the entire structural mod-agnosticism guarantee.
    implementation rootProject

    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
